[project]
name = "observability-steps"
version = "0.1.0"
description = "Shared pytest-bdd step definitions for Observability charm and solution tests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jubilant>=1.0",
    "observability-clients>=0.1.2",
    "pytest-bdd>=8.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "ty>=0.0.1a25",
    "codespell>=2.4.1",
    "vulture>=2.14",
    "pytest>=9.0.2",
]

[project.urls]
Homepage = "https://github.com/canonical/observability-libs/observability-steps"
Repository = "https://github.com/canonical/observability-libs/observability-steps"
Issues = "https://github.com/canonical/observability-libs/issues"
Changelog = "https://github.com/canonical/observability-libs/releases"

# Building and publishing
[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observability_steps"]

# Tools configuration
[tool.ruff]
line-length = 99

[tool.lint.pydocstyle]
convention = "google"

[tool.codespell]
skip = ".git,build,venv*"

[tool.vulture]
min_confidence = 80

[tool.pytest.ini_options]
addopts = "-p pytester"
