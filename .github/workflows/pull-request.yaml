name: Pull Request

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover changed packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: List all packages
        id: list
        run: |
          packages="$(find . -mindepth 2 -maxdepth 2 -name justfile -printf '%h\n' | sed 's|^\./||' | sort)"
          {
            echo "packages<<EOF"
            echo "$packages"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Determine changed files
        id: changed-files
        uses: tj-actions/changed-files@v47

      - name: Filter to packages with changes
        id: filter
        env:
          ALL_PACKAGES: ${{ steps.list.outputs.packages }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          changed=()
          while IFS= read -r package; do
            [[ -z "$package" ]] && continue
            for file in $CHANGED_FILES; do
              if [[ "$file" == "$package/"* ]]; then
                changed+=("$package")
                break
              fi
            done
          done <<< "$ALL_PACKAGES"
          packages="$(printf '%s\n' "${changed[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

  check:
    name: Check (${{ matrix.package }})
    needs: discover
    if: ${{ needs.discover.outputs.packages != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo snap install astral-uv --classic
          sudo snap install just --classic
      - name: Check
        run: just check
